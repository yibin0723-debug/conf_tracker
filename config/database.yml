default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DB_HOST", "db") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME", "conf_tracker") %>
  password: <%= ENV.fetch("DB_PASSWORD", "conf_tracker_password") %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME_DEVELOPMENT", "conf_tracker_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("DB_NAME_TEST", "conf_tracker_test") %>

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("DB_NAME_PRODUCTION", "conf_tracker_production") %>

  cache:
    <<: *default
    database: <%= ENV.fetch("DB_NAME_CACHE", "conf_tracker_production_cache") %>
    migrations_paths: db/cache_migrate

  queue:
    <<: *default
    database: <%= ENV.fetch("DB_NAME_QUEUE", "conf_tracker_production_queue") %>
    migrations_paths: db/queue_migrate

  cable:
    <<: *default
    database: <%= ENV.fetch("DB_NAME_CABLE", "conf_tracker_production_cable") %>
    migrations_paths: db/cable_migrate
